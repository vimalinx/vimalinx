<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title">
<title id="title">VimalinxOS — Discover, operate, verify, recover. A capability illustration, not a live execution trace.</title>
<defs><linearGradient id="mapBg" x2="1" y2="1"><stop stop-color="#201B2C"/><stop offset="1" stop-color="#121018"/></linearGradient>
<linearGradient id="beam"><stop stop-color="#B8D5A8"/><stop offset=".5" stop-color="#D1B6E5"/><stop offset="1" stop-color="#E0C386"/></linearGradient></defs>
<style>
text{font-family:'Noto Sans',Arial,sans-serif}
.mono{font-family:'DejaVu Sans Mono',monospace}
.serif{font-family:Georgia,'Noto Serif',serif}

@keyframes flow{to{stroke-dashoffset:-160}}
@keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}
.flow{animation:flow 14s linear infinite}
.signal{animation:signal 5s ease-in-out infinite}

@media(prefers-reduced-motion:reduce){.motion,.slide{animation:none!important}.slide{opacity:0}.slide.first{opacity:1}}
</style>

<rect width="1200" height="330" rx="16" fill="url(#mapBg)"/>
<text class="mono" x="40" y="40" fill="#C7B5D9" font-size="13" letter-spacing="2">01 / THE MAIN PROJECT</text>
<text class="serif" x="37" y="119" fill="#FAF5EF" font-size="64" letter-spacing="-2">VimalinxOS</text>
<text x="43" y="164" fill="#D2C7DD" font-size="20">让 AI 能在自己的电脑上，把事情做完。</text>
<text x="43" y="199" fill="#A99DB9" font-size="16">独立组件，清晰的能力入口。</text>
<text class="mono" x="43" y="270" fill="#DDC38B" font-size="14" letter-spacing="2">EXPLORE THE ECOSYSTEM →</text>
<path d="M615 145H1120" stroke="#C2AED8" stroke-opacity=".15" stroke-width="2"/>
<path class="motion flow" d="M615 145H1120" fill="none" stroke="url(#beam)" stroke-width="2" stroke-dasharray="10 30"/>
<circle cx="625" cy="145" r="27" fill="#1B1722" stroke="#B8D5A8" stroke-opacity=".55"/>
<circle class="motion signal" cx="625" cy="145" r="6" fill="#B8D5A8" style="animation-delay:0.0s"/>
<text class="mono" x="625" y="203" text-anchor="middle" fill="#B8D5A8" font-size="12" letter-spacing="1">DISCOVER</text>
<text x="625" y="229" text-anchor="middle" fill="#B8ADCA" font-size="16">发现</text><circle cx="790" cy="145" r="27" fill="#1B1722" stroke="#D3BCE8" stroke-opacity=".55"/>
<circle class="motion signal" cx="790" cy="145" r="6" fill="#D3BCE8" style="animation-delay:-1.2s"/>
<text class="mono" x="790" y="203" text-anchor="middle" fill="#D3BCE8" font-size="12" letter-spacing="1">OPERATE</text>
<text x="790" y="229" text-anchor="middle" fill="#B8ADCA" font-size="16">操作</text><circle cx="955" cy="145" r="27" fill="#1B1722" stroke="#B8C8E4" stroke-opacity=".55"/>
<circle class="motion signal" cx="955" cy="145" r="6" fill="#B8C8E4" style="animation-delay:-2.4s"/>
<text class="mono" x="955" y="203" text-anchor="middle" fill="#B8C8E4" font-size="12" letter-spacing="1">VERIFY</text>
<text x="955" y="229" text-anchor="middle" fill="#B8ADCA" font-size="16">验证</text><circle cx="1120" cy="145" r="27" fill="#1B1722" stroke="#E0C386" stroke-opacity=".55"/>
<circle class="motion signal" cx="1120" cy="145" r="6" fill="#E0C386" style="animation-delay:-3.5999999999999996s"/>
<text class="mono" x="1120" y="203" text-anchor="middle" fill="#E0C386" font-size="12" letter-spacing="1">RECOVER</text>
<text x="1120" y="229" text-anchor="middle" fill="#B8ADCA" font-size="16">恢复</text><text x="876" y="287" text-anchor="middle" fill="#93879F" font-size="13">能力分工示意 · 组件各自开发与发布</text>
</svg>